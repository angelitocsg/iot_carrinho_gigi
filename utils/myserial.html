<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Serial Command Sender PWA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="manifest.json" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        background: #f8f9fa;
      }
      .container {
        max-width: 480px;
        margin: 2em auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        padding: 2em 1em;
      }
      textarea {
        resize: none;
      }
      .quick-btns .btn {
        min-width: 90px;
        margin-bottom: 0.5em;
      }
      @media (max-width: 576px) {
        .container {
          padding: 1em 0.5em;
        }
        .quick-btns .btn {
          min-width: 70px;
          font-size: 0.95em;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 class="mb-4 text-center">Serial Command Sender</h2>
      <div class="mb-3 d-grid gap-2">
        <button id="connectBtn" class="btn btn-primary">Connect Serial</button>
      </div>
      <div class="mb-3 input-group">
        <input id="cmdInput" class="form-control" placeholder="Type command" />
        <button id="sendBtn" class="btn btn-success">Send</button>
      </div>
      <div class="quick-btns mb-3 row g-2">
        <div class="col-6 col-sm-4">
          <button class="quick btn btn-outline-primary w-100" data-cmd="o">START</button>
        </div>
        <div class="col-6 col-sm-4">
          <button class="quick btn btn-outline-danger w-100" data-cmd="s">STOP</button>
        </div>
        <div class="col-6 col-sm-4">
          <button class="quick btn btn-outline-warning w-100" data-cmd="t">TURBO</button>
        </div>
        <div class="col-6 col-sm-4">
          <button class="quick btn btn-outline-secondary w-100" data-cmd="l">LEFT</button>
        </div>
        <div class="col-6 col-sm-4">
          <button class="quick btn btn-outline-secondary w-100" data-cmd="r">RIGHT</button>
        </div>
        <div class="col-6 col-sm-4">
          <button class="quick btn btn-outline-success w-100" data-cmd="f">FORWARD</button>
        </div>
        <div class="col-12">
          <button class="quick btn btn-outline-info w-100" data-cmd="b">BACK</button>
        </div>
      </div>
      <h5 class="mt-4">Serial Output</h5>
      <textarea id="output" class="form-control mb-2" rows="6" readonly></textarea>
    </div>
    <!-- Bootstrap JS (optional, for some components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      let port, reader, writer;
      let quickCmdInterval = null;

      document.getElementById("connectBtn").onclick = async () => {
        try {
          port = await navigator.serial.requestPort();
          await port.open({ baudRate: 9600 });
          writer = port.writable.getWriter();
          reader = port.readable.getReader();
          readSerial();
          alert("Connected!");
        } catch (e) {
          alert("Error: " + e);
        }
      };

      document.getElementById("sendBtn").onclick = async () => {
        if (writer) {
          const cmd = document.getElementById("cmdInput").value + "\n";
          await writer.write(new TextEncoder().encode(cmd));
        }
      };

      document.querySelectorAll(".quick").forEach((btn) => {
        btn.addEventListener("mousedown", () => {
          if (writer) {
            const sendCmd = async () => {
              await writer.write(
                new TextEncoder().encode(btn.dataset.cmd + "\n")
              );
            };
            sendCmd(); // send immediately
            quickCmdInterval = setInterval(sendCmd, 100); // send every 100ms
          }
        });
        btn.addEventListener("mouseup", () => {
          clearInterval(quickCmdInterval);
        });
        btn.addEventListener("mouseleave", () => {
          clearInterval(quickCmdInterval);
        });
        btn.addEventListener(
          "touchstart",
          (e) => {
            e.preventDefault();
            if (writer) {
              const sendCmd = async () => {
                await writer.write(
                  new TextEncoder().encode(btn.dataset.cmd + "\n")
                );
              };
              sendCmd();
              quickCmdInterval = setInterval(sendCmd, 100);
            }
          },
          { passive: false }
        );
        btn.addEventListener("touchend", () => {
          clearInterval(quickCmdInterval);
        });
        btn.addEventListener("touchcancel", () => {
          clearInterval(quickCmdInterval);
        });
      });

      async function readSerial() {
        while (port && port.readable) {
          try {
            const { value } = await reader.read();
            if (value) {
              document.getElementById("output").value +=
                new TextDecoder().decode(value);
            }
          } catch {
            break;
          }
        }
      }
    </script>
  </body>
</html>
